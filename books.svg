<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Book 1 (back, tallest, dark blue) -->
  <rect x="8" y="12" width="18" height="56" rx="2" fill="#1b3a5c"/>
  <rect x="8" y="12" width="4" height="56" rx="1" fill="#0d2340"/>
  <rect x="9" y="18" width="2" height="44" rx="1" fill="#c9a84c" opacity="0.5"/>

  <!-- Book 2 (tilted slightly, teal) -->
  <rect x="28" y="18" width="16" height="50" rx="2" fill="#1e4a5c"/>
  <rect x="28" y="18" width="3.5" height="50" rx="1" fill="#122e3a"/>
  <rect x="29" y="25" width="1.5" height="36" rx="1" fill="#c9a84c" opacity="0.4"/>

  <!-- Book 3 (gold accent, medium height) -->
  <rect x="46" y="20" width="20" height="48" rx="2" fill="#2a1a00"/>
  <rect x="46" y="20" width="4" height="48" rx="1" fill="#1a0f00"/>
  <!-- Gold spine lines -->
  <rect x="47.5" y="27" width="1" height="6" rx="0.5" fill="#c9a84c"/>
  <rect x="47.5" y="36" width="1" height="3" rx="0.5" fill="#c9a84c"/>
  <rect x="47.5" y="42" width="1" height="6" rx="0.5" fill="#c9a84c"/>
  <!-- Gold decorative border on cover -->
  <rect x="52" y="24" width="11" height="40" rx="1" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>

  <!-- Book 4 (lying flat on top of stack, dark red) -->
  <rect x="6" y="62" width="62" height="10" rx="2" fill="#3a1020"/>
  <rect x="6" y="62" width="62" height="3" rx="1" fill="#250a14"/>
  <rect x="10" y="63.5" width="54" height="1" rx="0.5" fill="#c9a84c" opacity="0.3"/>

  <!-- Book 5 (small, standing, navy) -->
  <rect x="68" y="30" width="14" height="38" rx="2" fill="#0d2b45"/>
  <rect x="68" y="30" width="3" height="38" rx="1" fill="#071820"/>
  <rect x="69" y="37" width="1.5" height="24" rx="0.5" fill="#c9a84c" opacity="0.45"/>

  <!-- Book 6 (tallest right, olive/green) -->
  <rect x="84" y="14" width="16" height="54" rx="2" fill="#1a2e1a"/>
  <rect x="84" y="14" width="3.5" height="54" rx="1" fill="#0f1c0f"/>
  <rect x="85" y="22" width="1.5" height="8" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="85" y="33" width="1.5" height="4" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="85" y="40" width="1.5" height="8" rx="0.5" fill="#c9a84c" opacity="0.5"/>

  <!-- Shelf / base line -->
  <rect x="4" y="71" width="112" height="3" rx="1.5" fill="#c9a84c" opacity="0.25"/>
</svg>
